schemaVersion = 1
id = "theboringteam.boringnotch.claude-code"
slug = "boring-agent"
name = "BoringAgent"
icon = "https://raw.githubusercontent.com/TheBoredTeam/boring-notch-extensions/main/assets/extensions/boring-agent.png"
tagline = "One notch dashboard for your coding agents."
description = "A free, independent agent dashboard with Progress and Usage views, provider quota rings, native detail popovers, session search, and question alerts in regular and compact layouts. Claude Code is connected through its relay; Codex and Antigravity adapters are prepared and explicitly unavailable until implemented. Return to the originating agent to reply."
version = "0.2.1"
status = "preview"
statusNote = "Self-signed development preview. Requires the native-extension Debug host with development plugins enabled. Not notarized and not installable in a production host."
categories = ["Developer Tools", "Productivity"]
requirements = ["macOS 14 or later", "Compatible Boring Notch native-extension Debug host", "Current Claude Code CLI; 2.1.243 or later recommended", "Explicit relay installation and relay-folder access"]
websiteUrl = "https://github.com/TheBoredTeam/boring-notch-extensions/tree/main/packages/boring-agent"
sourceUrl = "https://github.com/TheBoredTeam/boring-notch-extensions/tree/main/packages/boring-agent"
supportUrl = "https://github.com/TheBoredTeam/boring-notch-extensions/issues"
privacy = "Reads documented hook and status-line input. Stores bounded local session metadata, questions, choices, and usage in a private relay folder. Does not read transcripts, credentials, or unrelated tool arguments. Opt-in account usage reads the default Claude Code OAuth Keychain login in the separate relay helper and sends it only to Anthropic profile/usage endpoints. Tokens are never stored, refreshed, or exposed to the host. No analytics, browser cookies, or transcript reading. Question text can contain sensitive project information."
installSteps = ["Read the package README and download its development ZIP from GitHub Releases.", "Install in a compatible Debug host through Settings → Extensions.", "Copy and run the bundled relay setup command, then select the printed relay folder in extension settings.", "Open the Agents tab. Current local Claude Code sessions reload hooks and appear after their next supported event."]

[developer]
name = "TheBoredTeam"
url = "https://github.com/TheBoredTeam"

[price]
amount = 0
currency = "USD"
billing = "free"

[[features]]
title = "One dashboard, multiple agents"
description = "Shared Progress and Usage views adapt to the host's regular and compact bounds. Provider adapters keep feature logic separate from reusable interface components."

[[features]]
title = "Questions where you can see them"
description = "An aggregate activity calls attention to questions and permissions. Open the original terminal or an existing Remote Control link when available. Desktop can only be activated as an app."

[[features]]
title = "Usage without guessing"
description = "Provider rings show remaining allowance, with individual quota windows and reset times in a native popover. Missing and stale reports stay labeled; session context is separate."
