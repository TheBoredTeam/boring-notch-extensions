name: BoringAgent development extension

on:
  pull_request:
    paths: ["packages/boring-agent/**", ".github/workflows/claude-code.yml"]
  push:
    branches: [main]
    paths: ["packages/boring-agent/**", ".github/workflows/claude-code.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a self-signed development prerelease from current main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: claude-code-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build both architectures without release credentials
        working-directory: packages/boring-agent
        run: bash build.sh --configuration debug --architecture universal
      - name: Relay, native ABI, lifecycle, and 1,000-session stress tests
        working-directory: packages/boring-agent
        run: bash scripts/test.sh dist/theboringteam.boringnotch.claude-code.bnplugin

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require the tested revision to still be current main
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Import only the extension's self-signed identity
        timeout-minutes: 2
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.CLAUDE_CODE_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.CLAUDE_CODE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/claude-code-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'claude-code-signing.p12').write_bytes(base64.b64decode(os.environ['SIGNING_P12'], validate=True))
          PY
          security import "$RUNNER_TEMP/claude-code-signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          python3 - <<'PY'
          import json, os, shlex, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          keychain = str(root / 'claude-code-signing.keychain-db')
          existing = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          existing = [path for path in existing if path != keychain]
          (root / 'claude-code-keychain-search.json').write_text(json.dumps(existing))
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', keychain, *existing], check=True)
          PY
          rm -f "$RUNNER_TEMP/claude-code-signing.p12"
      - name: Trust only the preview certificate for code signing on this runner
        timeout-minutes: 1
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.CLAUDE_CODE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/claude-code-signing.keychain-db"
          # The P12 has exactly one self-signed identity. Trust only its public
          # certificate for code signing in this disposable runner. The admin
          # trust domain avoids an interactive user-authorization dialog on CI.
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/claude-code-public.pem"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/claude-code-public.pem"
          python3 - <<'PY'
          import os, subprocess
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', os.environ['RUNNER_TEMP'] + '/claude-code-signing.keychain-db'], text=True)
          if os.environ['SIGNING_IDENTITY'] not in identities:
              raise SystemExit('Expected signing identity is not valid for code signing')
          PY
      - name: Verify private-key access before building
        timeout-minutes: 1
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.CLAUDE_CODE_SIGNING_IDENTITY }}
        run: |
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/claude-code-signing-probe.c"
          xcrun clang "$RUNNER_TEMP/claude-code-signing-probe.c" -o "$RUNNER_TEMP/claude-code-signing-probe"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$RUNNER_TEMP/claude-code-signing.keychain-db" --options runtime --timestamp=none "$RUNNER_TEMP/claude-code-signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/claude-code-signing-probe"
      - name: Build and verify the signed universal preview
        working-directory: packages/boring-agent
        env:
          SIGNING_IDENTITY: ${{ secrets.CLAUDE_CODE_SIGNING_IDENTITY }}
        run: bash build.sh --configuration debug --architecture universal --identity "$SIGNING_IDENTITY" --keychain "$RUNNER_TEMP/claude-code-signing.keychain-db"
      - name: Test the signed artifact
        working-directory: packages/boring-agent
        run: bash scripts/test.sh dist/theboringteam.boringnotch.claude-code.bnplugin
      - name: Publish immutable development prerelease
        working-directory: packages/boring-agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          tag="boring-agent-v${version}-dev.1"
          archive="BoringAgent-${version}-development.zip"
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS)
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" "dist/$archive" dist/SHA256SUMS --verify-tag --prerelease --title "BoringAgent ${version} — development preview" --notes-file RELEASE.md
      - name: Remove temporary signing material
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, ssl, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def clean_command(arguments):
              try:
                  subprocess.run(arguments, timeout=10, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  print('::warning::A keychain cleanup command timed out on the disposable runner')
          (root / 'claude-code-signing.p12').unlink(missing_ok=True)
          search = root / 'claude-code-keychain-search.json'
          if search.exists():
              clean_command(['security', 'list-keychains', '-d', 'user', '-s', *json.loads(search.read_text())])
              search.unlink()
          keychain = root / 'claude-code-signing.keychain-db'
          clean_command(['security', 'delete-keychain', str(keychain)])
          for suffix in ['', '-shm', '-wal']:
              Path(str(keychain) + suffix).unlink(missing_ok=True)
          certificate = root / 'claude-code-public.pem'
          if certificate.exists():
              digest = hashlib.sha1(ssl.PEM_cert_to_DER_cert(certificate.read_text())).hexdigest().upper()
              clean_command(['sudo', '-n', 'security', 'remove-trusted-cert', '-d', str(certificate)])
              clean_command(['sudo', '-n', 'security', 'delete-certificate', '-Z', digest, '/Library/Keychains/System.keychain'])
              certificate.unlink()
          for name in ['claude-code-signing-probe', 'claude-code-signing-probe.c']:
              (root / name).unlink(missing_ok=True)
          PY
