name: Validate registry

on:
  pull_request:
    paths: ["extensions/**", "scripts/validate_registry.py", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: ["extensions/**", "scripts/validate_registry.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_registry.py
