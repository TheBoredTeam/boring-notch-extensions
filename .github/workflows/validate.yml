# Keep the original pack release gate while routing native records through
# their own schema. Native previews do not have downloadable release artifacts.
name: Validate catalog

on:
  pull_request:
    paths:
      - "extensions/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate native metadata and legacy release assets
        run: python3 scripts/validate_registry.py --check-legacy-artifacts
